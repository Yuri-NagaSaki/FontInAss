services:
  fontinass:
    build: .
    container_name: fontinass-local
    restart: unless-stopped
    # SECURITY: Bound to 127.0.0.1. Put a TLS reverse proxy in front of it;
    # do not publish the container port directly on a production host.
    ports:
      - "127.0.0.1:3300:3000"
    volumes:
      # Mount your font directory here (fonts go in ./fonts on host)
      - ./fonts:/app/fonts
      # Persist the SQLite database
      - ./data:/app/data
    environment:
      - PORT=3000
      - NODE_ENV=production
      - FONTINASS_PUBLIC_ORIGIN=${FONTINASS_PUBLIC_ORIGIN:-http://localhost:3300}
      - FONT_DIR=/app/fonts
      - DB_PATH=/app/data/fontinass-v2.db
      - FONTINASS_OPERATOR_CREDENTIAL=${FONTINASS_OPERATOR_CREDENTIAL:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3300}
      - FONTINASS_OIDC_ISSUER=${FONTINASS_OIDC_ISSUER:-https://oauth.anibt.net}
      - FONTINASS_OIDC_CLIENT_ID=${FONTINASS_OIDC_CLIENT_ID:-}
      - FONTINASS_OIDC_CLIENT_SECRET=${FONTINASS_OIDC_CLIENT_SECRET:-}
      - FONTINASS_OIDC_REDIRECT_URI=${FONTINASS_OIDC_REDIRECT_URI:-http://localhost:3300/api/auth/callback}
      - FONTINASS_OIDC_POST_LOGOUT_REDIRECT_URI=${FONTINASS_OIDC_POST_LOGOUT_REDIRECT_URI:-http://localhost:3300/}
      - FONTINASS_OIDC_SCOPES=${FONTINASS_OIDC_SCOPES:-openid profile anibt:user_id}
      - FONTINASS_ENTITLEMENT_ORIGIN=${FONTINASS_ENTITLEMENT_ORIGIN:-https://anibt.net}
      - FONTINASS_ENTITLEMENT_KEY_ID=${FONTINASS_ENTITLEMENT_KEY_ID:-}
      - FONTINASS_ENTITLEMENT_SIGNING_SECRET=${FONTINASS_ENTITLEMENT_SIGNING_SECRET:-}
      - FONTINASS_SESSION_FINGERPRINT_SECRET=${FONTINASS_SESSION_FINGERPRINT_SECRET:-}
      - FONTINASS_SESSION_ENCRYPTION_KEY=${FONTINASS_SESSION_ENCRYPTION_KEY:-}
      - FONTINASS_LOGIN_TRANSACTION_TTL_MS=${FONTINASS_LOGIN_TRANSACTION_TTL_MS:-600000}
      - FONTINASS_SESSION_IDLE_TTL_MS=${FONTINASS_SESSION_IDLE_TTL_MS:-43200000}
      - FONTINASS_SESSION_ABSOLUTE_TTL_MS=${FONTINASS_SESSION_ABSOLUTE_TTL_MS:-604800000}
      - FONTINASS_RECENT_AUTH_TTL_MS=${FONTINASS_RECENT_AUTH_TTL_MS:-600000}
      - FONTINASS_CREDENTIALS_PER_USER=${FONTINASS_CREDENTIALS_PER_USER:-5}
      - FONTINASS_CREDENTIALS_PER_ORGANIZATION=${FONTINASS_CREDENTIALS_PER_ORGANIZATION:-25}
      - FONTINASS_CREDENTIAL_CREATIONS_PER_HOUR=${FONTINASS_CREDENTIAL_CREATIONS_PER_HOUR:-10}
      - FONTINASS_CREDENTIAL_MAX_TTL_MS=${FONTINASS_CREDENTIAL_MAX_TTL_MS:-31536000000}
      - SUBSET_CONCURRENCY=${SUBSET_CONCURRENCY:-5}
      - CACHE_MAX_ENTRIES=${CACHE_MAX_ENTRIES:-500}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL:-}
      - SHARING_MAX_FILE_SIZE=${SHARING_MAX_FILE_SIZE:-209715200}
      - SHARING_RATE_LIMIT=${SHARING_RATE_LIMIT:-50}
      - UPLOAD_TARGET_DIR=${UPLOAD_TARGET_DIR:-CatCat-Fonts/}
      - PUBLIC_UPLOAD_MAX_FILES=${PUBLIC_UPLOAD_MAX_FILES:-20}
      - PUBLIC_UPLOAD_MAX_FILE_SIZE=${PUBLIC_UPLOAD_MAX_FILE_SIZE:-104857600}
      - PUBLIC_UPLOAD_MAX_BATCH_SIZE=${PUBLIC_UPLOAD_MAX_BATCH_SIZE:-209715200}
      - PUBLIC_UPLOAD_REQUESTS_PER_MINUTE=${PUBLIC_UPLOAD_REQUESTS_PER_MINUTE:-30}
      - PENDING_DIR=/app/data/pending-v2
      - LOG_DIR=/app/data/logs
      - ARCHIVE_MAX_UNCOMPRESSED=${ARCHIVE_MAX_UNCOMPRESSED:-2147483648}
      - AUTO_INDEX_INTERVAL_HOURS=${AUTO_INDEX_INTERVAL_HOURS:-4}
