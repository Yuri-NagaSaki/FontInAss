[package]
name = "fontinass"
version = "2.0.0"
edition = "2024"
description = "CLI tool for FontInAss subtitle font subsetting service"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", features = ["multipart", "rustls", "json"], default-features = false }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
indicatif = "0.18"
console = "0.16"
base64 = "0.23"
glob = "0.3"
walkdir = "2"
dirs = "6"
anyhow = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
